<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Something went wrong | FaculZo</title><meta name="robots" content="noindex"><link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2e8;--bg2:#efe7d4;--card:#fffdf7;--ink:#17140c;--mut:#5f5640;--line:rgba(120,92,24,.22);--gold:#b8860b;--gt:linear-gradient(135deg,#7a5410,#c99a2e 35%,#e8c560 52%,#b8860b 75%,#7a5410);--glow:rgba(201,154,46,.28);--btn:#17140c;--btnt:#f7ecc9}
@media (prefers-color-scheme:dark){:root{--bg:#09090a;--bg2:#101012;--card:#141416;--ink:#f5efe0;--mut:#b4aa90;--line:rgba(232,197,96,.2);--gold:#e8c560;--gt:linear-gradient(135deg,#a87a1e,#e8c560 35%,#fff2b8 52%,#c99a2e 75%,#8c6317);--glow:rgba(232,197,96,.18);--btn:linear-gradient(135deg,#c99a2e,#e8c560);--btnt:#17140c}}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font:400 16px/1.65 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{color:inherit}img,svg{max-width:100%}

body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
main{max-width:480px;width:100%;animation:up .8s both}img{display:block;width:96px;margin:0 auto 20px;filter:drop-shadow(0 12px 28px var(--glow))}
.code{font-size:clamp(76px,22vw,128px);font-weight:600;line-height:1;letter-spacing:-3px;background-image:var(--gt);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1{font-size:26px;font-weight:600;margin:10px 0 8px}p{color:var(--mut);margin-bottom:26px}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;font-weight:600;text-decoration:none;background:var(--btn);color:var(--btnt);min-height:44px}
.sm{display:block;margin-top:18px;color:var(--mut);font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(24px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><img src="/logo.svg" alt="FaculZo logo"><div class="code">Oops</div><h1>Something went wrong</h1><p>We could not show this page just now. Please try again in a moment.</p><a class="btn" href="/">Try again</a><a class="sm" href="mailto:contact@nagendraglobalinnovations.in">contact@nagendraglobalinnovations.in</a></main></body></html>
